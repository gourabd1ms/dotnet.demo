name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Ensure SonarQube Cloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          http_code=$(curl -s -o /tmp/sonar_create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarqube.us/api/projects/create" \
            --data-urlencode "organization=gourabd1ms" \
            --data-urlencode "project=gourabd1ms_dotnet_demo" \
            --data-urlencode "name=dotnet.demo")
          echo "HTTP $http_code"
          cat /tmp/sonar_create.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            if grep -qi "already exist" /tmp/sonar_create.json; then
              echo "Project already exists, continuing"
            else
              echo "Failed to create Sonar project"
              exit 1
            fi
          fi
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-sonarscanner begin /k:"gourabd1ms_dotnet_demo" /o:"gourabd1ms" /d:sonar.host.url="https://sonarqube.us" /d:sonar.token="$SONAR_TOKEN"
          dotnet build
          dotnet test
          dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
